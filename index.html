    <script>
      (() => {
        const structuredDataScript = Array.from(document.querySelectorAll('script[type="application/ld+json"]'))
          .find((script) => script.textContent?.includes('#kredit-motor-honda'));
        if (!structuredDataScript) return;

        Promise.all([fetch('/api/motors'), fetch('/api/settings')])
          .then(async ([motorsResponse, settingsResponse]) => {
            const motors = motorsResponse.ok ? await motorsResponse.json() : [];
            const settings = settingsResponse.ok ? await settingsResponse.json() : {};
            const imagePath = (Array.isArray(motors) ? motors : [])
              .flatMap((motor) => [motor.image, ...(Array.isArray(motor.images) ? motor.images : [])])
              .find((image) => typeof image === 'string' && image.trim())
              || settings.heroImage
              || settings.logo;
            if (!imagePath) return;

            const structuredData = JSON.parse(structuredDataScript.textContent || '{}');
            const graph = Array.isArray(structuredData['@graph']) ? structuredData['@graph'] : [structuredData];
            const product = graph.find((item) => item['@id'] === 'https://kreditmotorhonda.tech/#kredit-motor-honda');
            if (!product) return;

            product.image = new URL(imagePath, window.location.origin).href;
            structuredDataScript.textContent = JSON.stringify(structuredData).replace(/</g, '\\u003c');
          })
          .catch(() => undefined);
      })();
