name: Article Studio validation

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/ArticleManager.tsx'
      - 'src/components/ArticleSection.tsx'
      - 'src/types.ts'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/article-studio-ci.yml'
  push:
    branches: [feature/honda-article-studio]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
