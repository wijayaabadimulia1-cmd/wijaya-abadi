name: Deploy to Ubuntu VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure SSH host key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "Missing VPS_KNOWN_HOSTS secret" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: /var/www/wijaya.kreditmotorhonda.id
          APP_REPO: https://github.com/${{ github.repository }}.git
          APP_BRANCH: main
          DOMAIN: kreditmotorhonda.tech
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" <<'SSH'
          set -euo pipefail

          export APP_DIR="/var/www/wijaya.kreditmotorhonda.id"
          export APP_REPO="https://github.com/${{ github.repository }}.git"
          export APP_BRANCH="main"
          export DOMAIN="kreditmotorhonda.tech"
          export CERTBOT_EMAIL="${{ secrets.CERTBOT_EMAIL }}"
          CERTBOT_EMAIL="${CERTBOT_EMAIL:-admin@kreditmotorhonda.tech}"

          sudo apt-get update
          sudo apt-get install -y curl git nginx certbot python3-certbot-nginx

          sudo mkdir -p "$APP_DIR"
          sudo chown -R "${USER}:${USER}" "$APP_DIR"

          if [ ! -d "$APP_DIR/.git" ]; then
            git clone --branch "$APP_BRANCH" --single-branch "$APP_REPO" "$APP_DIR"
          fi

          cd "$APP_DIR"
          PERSISTENT_DIR="/var/lib/honda-wijaya-abadi"
          DATA_DIR="$PERSISTENT_DIR/data"
          UPLOADS_DIR="$PERSISTENT_DIR/uploads"
          if [ ! -f "$DATA_DIR/db.json" ] || [ ! -d "$UPLOADS_DIR" ]; then
            if command -v pm2 >/dev/null 2>&1 && pm2 describe honda-wijaya-abadi >/dev/null 2>&1; then
              pm2 stop honda-wijaya-abadi
            fi
          fi
          sudo mkdir -p "$DATA_DIR" "$UPLOADS_DIR"
          sudo chown -R "${USER}:${USER}" "$PERSISTENT_DIR"
          if [ ! -f "$DATA_DIR/db.json" ] && [ -f "$APP_DIR/data/db.json" ]; then
            cp "$APP_DIR/data/db.json" "$DATA_DIR/db.json"
          fi
          if [ -d "$APP_DIR/public/uploads" ]; then
            cp -an "$APP_DIR/public/uploads/." "$UPLOADS_DIR/"
          fi
          if ! git diff --quiet -- data/db.json; then
            git checkout -- data/db.json
          fi

          git fetch origin "$APP_BRANCH"
          git checkout "$APP_BRANCH"
          git pull --ff-only origin "$APP_BRANCH"

          if ! command -v node >/dev/null 2>&1 || [ "$(node -p 'process.versions.node.split(".")[0]')" -lt 22 ]; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi

          if [ ! -f "$APP_DIR/.env" ]; then
            echo "Missing $APP_DIR/.env. Create it and configure production values before deploying." >&2
            exit 1
          fi

          npm install
          npm run build

          if ! command -v pm2 >/dev/null 2>&1; then
            sudo npm install -g pm2
          fi

          if [ ! -f ecosystem.config.cjs ]; then
            echo "ecosystem.config.cjs not found" >&2
            exit 1
          fi

          mkdir -p logs
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save

          sudo tee "/etc/nginx/sites-available/$DOMAIN" >/dev/null <<NGINX
          server {
              listen 80;
              server_name $DOMAIN;
              client_max_body_size 100m;

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_cache_bypass $http_upgrade;
              }
          }
          NGINX

          sudo ln -sf "/etc/nginx/sites-available/$DOMAIN" "/etc/nginx/sites-enabled/$DOMAIN"
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl reload nginx

          if [ ! -d "/etc/letsencrypt/live/$DOMAIN" ]; then
            sudo certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos -m "$CERTBOT_EMAIL"
          fi

          for url in "https://$DOMAIN/" "https://$DOMAIN/sitemap.xml"; do
            status=$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' "$url")
            if [ "$status" != "200" ]; then
              echo "Expected HTTP 200, received HTTP $status: $url" >&2
              exit 1
            fi
            echo "HTTP $status: $url"
          done
          SSH
