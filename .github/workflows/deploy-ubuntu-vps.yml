name: Deploy to Ubuntu VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure SSH host key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh "${VPS_USER}@${VPS_HOST}" <<'SSH'
          set -euo pipefail
          APP_DIR="/opt/wijaya-abadi-deploy-src"
          APP_REPO="https://github.com/wijayaabadimulia1-cmd/wijaya-abadi.git"
          APP_BRANCH="main"
          if [ ! -d "$APP_DIR/.git" ]; then
            sudo install -d -o "$USER" -g "$(id -gn)" "$APP_DIR"
            git clone --branch "$APP_BRANCH" --single-branch "$APP_REPO" "$APP_DIR"
          fi
          cd "$APP_DIR"
          if [ -n "$(git status --porcelain)" ]; then
            echo "Deployment checkout has local changes; refusing to overwrite it." >&2
            exit 1
          fi
          git fetch origin "$APP_BRANCH"
          git checkout "$APP_BRANCH"
          git pull --ff-only origin "$APP_BRANCH"
          ./deploy-vps-safe.sh
          SSH
