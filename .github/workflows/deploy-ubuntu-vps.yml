name: Deploy to Ubuntu VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: /var/www/wijaya.kreditmotorhonda.id
          APP_REPO: https://github.com/${{ github.repository }}.git
          APP_BRANCH: main
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${VPS_USER}@${VPS_HOST}" <<'SSH'
          set -euo pipefail

          export APP_DIR="/var/www/wijaya.kreditmotorhonda.id"
          export APP_REPO="https://github.com/${{ github.repository }}.git"
          export APP_BRANCH="main"

          sudo mkdir -p "$APP_DIR"
          sudo chown -R "${USER}:${USER}" "$APP_DIR"

          if [ ! -d "$APP_DIR/.git" ]; then
            git clone --branch "$APP_BRANCH" --single-branch "$APP_REPO" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git fetch origin "$APP_BRANCH"
          git checkout "$APP_BRANCH"
          git pull --ff-only origin "$APP_BRANCH"

          if ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi

          npm install
          npm run build

          if ! command -v pm2 >/dev/null 2>&1; then
            sudo npm install -g pm2
          fi

          if [ ! -f ecosystem.config.cjs ]; then
            echo "ecosystem.config.cjs not found" >&2
            exit 1
          fi

          pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs

          sudo tee /etc/nginx/sites-available/wijaya.kreditmotorhonda.id >/dev/null <<'NGINX'
          server {
              listen 80;
              server_name wijaya.kreditmotorhonda.id;
              client_max_body_size 0;

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_cache_bypass $http_upgrade;
              }
          }
          NGINX

          sudo ln -sf /etc/nginx/sites-available/wijaya.kreditmotorhonda.id /etc/nginx/sites-enabled/
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl reload nginx

          if [ ! -d /etc/letsencrypt/live/wijaya.kreditmotorhonda.id ]; then
            sudo certbot --nginx -d wijaya.kreditmotorhonda.id --non-interactive --agree-tos -m admin@wijaya.kreditmotorhonda.id || true
          fi

          status=$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' https://kreditmotorhonda.tech/ || true)
          echo "HTTP status for canonical URL: $status"
          SSH
