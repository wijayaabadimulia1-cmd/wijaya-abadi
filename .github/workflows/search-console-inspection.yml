name: Search Console URL Inspection

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect sitemap URLs
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:kreditmotorhonda.tech' }}
          GSC_SITEMAP_URL: https://kreditmotorhonda.tech/sitemap.xml
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo 'Add the GSC_SERVICE_ACCOUNT_JSON Actions secret, then rerun.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/inspect-search-console.mjs
